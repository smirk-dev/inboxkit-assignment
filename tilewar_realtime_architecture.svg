  <desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(255, 255, 255);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Anthropic Sans&quot;, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Browser clients connect bidirectionally over WebSocket to a Node.js backend, which validates claims using Redis for cooldown and pub/sub fan-out, persists ownership in PostgreSQL with atomic updates, and broadcasts diffs back to every connected client.</desc>
